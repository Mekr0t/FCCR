# Dev ablation grid for S2-1 (crosslingual). Expanded by scripts/run_fusion.py --sweep into configs/rrf_cross_dev_*.yaml.
name_prefix: rrf_cross_dev
base:
  data_dir: data/raw/semeval2025_task7_data/train_dev_sets
  track: crosslingual
  eval_split: dev
  k: 10
  top_n: 100
ks: [10, 30, 60, 100]
bm25_weights: [0.3, 0.5, 1.0]
input_sets:
  A:
    label: "bm25eng+e5eng"
    model_label: "RRF(bm25+mE5)"
    members:
      - {run: bm25_cross_dev_eng_stem_stop, kind: bm25}
      - {run: dense_cross_dev_eng, kind: dense}
  B:
    label: "bm25eng+bm25both+e5eng"
    model_label: "RRF(bm25+bm25both+mE5)"
    members:
      - {run: bm25_cross_dev_eng_stem_stop, kind: bm25}
      - {run: bm25_cross_dev_both_stem_stop_thai, kind: bm25}
      - {run: dense_cross_dev_eng, kind: dense}
